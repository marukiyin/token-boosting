<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Tokenqueue.io</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout concept: an airport gate. The queue is a stack of boarding passes with perforated stubs; priority passes carry a gold strip. */
:root {
  --bg: #dcaa55;
  --bg-a: #f3d48f;
  --bg-b: #c08330;
  --glow: rgba(255, 238, 176, .8);
  --ring: rgba(110, 62, 0, .5);
  --sweep: rgba(255, 247, 214, .38);
  --vig: rgba(88, 42, 0, .38);
  --spark-rgb: 255, 248, 218;
  --paper: #fff6dc;
  --ink: #2b1b06;
  --muted: #4f3810;
  --line: #9a7228;
  --accent: #8a3b00;
  --accent-ink: #fff3d6;
  --prio: #ffd23f;
  --prio-ink: #2a1c00;
  --ok: #0b6b43;
  --warn: #a63a06;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1206; --bg-a: #33220a; --bg-b: #120c03; --glow: rgba(255, 170, 40, .3); --ring: rgba(255, 196, 80, .5);
    --sweep: rgba(255, 190, 70, .12); --vig: rgba(0, 0, 0, .55); --spark-rgb: 255, 201, 80;
    --paper: #2a1d0a; --ink: #f7e8c4; --muted: #cdb07a; --line: #6b4f1c;
    --accent: #ffb938; --accent-ink: #1a1206; --prio: #ffd23f; --prio-ink: #2a1c00;
    --ok: #4bd08f; --warn: #ff9a6b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1206; --bg-a: #33220a; --bg-b: #120c03; --glow: rgba(255, 170, 40, .3); --ring: rgba(255, 196, 80, .5);
  --sweep: rgba(255, 190, 70, .12); --vig: rgba(0, 0, 0, .55); --spark-rgb: 255, 201, 80;
  --paper: #2a1d0a; --ink: #f7e8c4; --muted: #cdb07a; --line: #6b4f1c;
  --accent: #ffb938; --accent-ink: #1a1206; --prio: #ffd23f; --prio-ink: #2a1c00;
  --ok: #4bd08f; --warn: #ff9a6b; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.wrap { max-width: 880px; margin: 0 auto; position: relative; z-index: 1; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* animated background: golden glow, slow-turning dashed rings, a light sweep and drifting sparks */
#bg {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background: radial-gradient(70% 55% at 50% 36%, var(--glow) 0%, transparent 70%), linear-gradient(160deg, var(--bg-a), var(--bg-b));
}
#bg::before { content: ""; position: absolute; inset: 0; z-index: 3; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, var(--vig) 100%); }
#bg svg { position: absolute; left: 50%; top: 34%; width: max(900px, 120vmax); aspect-ratio: 1; translate: -50% -50%; opacity: .6; }
#bg .ring { fill: none; stroke: var(--ring); transform-origin: 300px 300px; }
#bg .r1 { animation: spin 140s linear infinite; }
#bg .r2 { animation: spin 90s linear infinite reverse; }
#bg .r3 { animation: spin 220s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#bg .sweep { position: absolute; inset: -20% -40%; background: linear-gradient(115deg, transparent 42%, var(--sweep) 50%, transparent 58%); animation: sweep 14s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: translateX(-35%); } to { transform: translateX(35%); } }
#bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
@media (prefers-reduced-motion: reduce) { #bg .ring, #bg .sweep { animation: none; } }

/* identity row */
.idrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.idrow .hosted { display: inline-flex; align-items: baseline; gap: 8px; font: 500 15px/1.3 var(--font-body); }
.idrow .hosted small { font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.idrow .hosted b { font-weight: 700; letter-spacing: .02em; overflow-wrap: anywhere; }
.idrow .disc { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--ink); background: var(--paper); padding: 4px 4px 4px 10px; font: 500 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; }
.idrow .disc b { text-transform: none; letter-spacing: .02em; font-size: 14px; font-weight: 700; user-select: all; }
.idrow .domain { margin-left: auto; font: 500 12px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* legal pages and footer */
.rule ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.rule li + li { margin-top: 4px; }
.rule div > p + p { margin-top: 8px; }
.updated { font: 500 12px/1.4 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }
.consent { margin: 0; font-size: 13px; color: var(--muted); max-width: 62ch; }
footer a { color: var(--ink); text-underline-offset: 3px; }

/* status pills */
.statusbar { display: flex; flex-wrap: wrap; gap: 8px; }
.statusbar span { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--ink); background: var(--paper); padding: 8px 12px; font: 700 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.statusbar span.off { color: var(--warn); border-color: var(--warn); }

/* payment buttons */
.pay { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.pass .pay .btn { padding: 9px 12px; font-size: 11px; }

/* now-playing animation */
.eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 22px; }
.eq i { width: 4px; height: 100%; background: var(--accent); transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-duration: .8s; animation-delay: -.3s; }
.eq i:nth-child(3) { animation-duration: 1.2s; animation-delay: -.6s; }
.eq i:nth-child(4) { animation-duration: .9s; animation-delay: -.1s; }
@keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
.music .seg button.pulse { animation: btnpulse .9s ease-out; }
@keyframes btnpulse { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--prio) 90%, transparent); } to { box-shadow: 0 0 0 16px transparent; } }
.mnote { position: fixed; z-index: 44; pointer-events: none; font-size: 22px; line-height: 1; color: var(--accent); animation: noteUp 1.5s ease-out forwards; }
@keyframes noteUp { from { opacity: 1; transform: translate(0, 0) scale(.8); } to { opacity: 0; transform: translate(var(--dx), -110px) scale(1.3) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { .eq i { animation: none; transform: scaleY(.6); } .music .seg button.pulse { animation: none; } }

/* live toasts and confetti */
#toasts { position: fixed; z-index: 40; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; max-width: min(360px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-left: 8px solid var(--prio); padding: 10px 14px; font: 600 14px/1.3 var(--font-body); box-shadow: 4px 4px 0 var(--ink); overflow-wrap: anywhere; animation: toastIn .3s ease-out both; transition: opacity .3s, transform .3s; }
.toast.big { background: var(--prio); color: var(--prio-ink); font: 800 22px/1.1 var(--font-display); text-transform: uppercase; }
.toast.out { opacity: 0; transform: translateY(6px); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 45; pointer-events: none; }

/* intro: tap to enter, My Song plays with lyrics while the gate loads, then the gate opens */
#welcome {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; text-align: center; overflow: hidden;
  background: radial-gradient(70% 55% at 50% 40%, var(--glow) 0%, transparent 70%), linear-gradient(160deg, var(--bg-a), var(--bg-b));
  color: var(--ink); clip-path: circle(150% at 50% 50%);
  transition: clip-path 1s cubic-bezier(.7, 0, .2, 1), opacity .4s ease .7s;
}
#welcome.out { clip-path: circle(0% at 50% 50%); opacity: 0; pointer-events: none; }
#welcome::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, var(--vig) 100%); pointer-events: none; }
#welcome svg { position: absolute; left: 50%; top: 50%; width: max(760px, 110vmax); aspect-ratio: 1; translate: -50% -50%; opacity: .55; }
#welcome .wr { fill: none; stroke: var(--ring); transform-origin: 300px 300px; }
#welcome .wr1 { animation: spin 90s linear infinite; }
#welcome .wr2 { animation: spin 60s linear infinite reverse; }
#w-viz { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.w-inner { position: relative; display: grid; gap: 16px; justify-items: center; max-width: 760px; }
.w-kicker { margin: 0; font: 500 12px/1 var(--font-mono); letter-spacing: .22em; text-transform: uppercase; animation: fadeUp .8s .1s both; }
.w-title { margin: 0; display: flex; justify-content: center; font: 900 clamp(64px, 19vw, 168px)/.9 var(--font-display); text-transform: uppercase; transition: font-size .6s ease; }
.w-title span { display: inline-block; animation: rise .75s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.25s + var(--i) * .07s); }
.w-sub { margin: 0; font: 800 clamp(26px, 6vw, 46px)/1 var(--font-display); text-transform: uppercase; letter-spacing: .04em; animation: fadeUp .8s 1s both; }
.w-sub b { color: var(--accent); font-weight: 800; }
.w-host { margin: 0; font: 500 14px/1.3 var(--font-body); animation: fadeUp .8s 1.2s both; }
.w-lyrics { display: none; min-height: 3.2em; align-items: center; justify-content: center; max-width: 16em; font: 900 clamp(30px, 7vw, 58px)/1.02 var(--font-display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.w-lyrics span { animation: lyricIn .45s ease-out both; }
@keyframes lyricIn { from { opacity: 0; transform: translateY(16px) scale(.96); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
#welcome[data-stage="play"] .w-title { font-size: clamp(40px, 10vw, 80px); }
#welcome[data-stage="play"] .w-lyrics { display: flex; }
#welcome[data-stage="play"] .w-sub, #welcome[data-stage="play"] .w-host, #welcome[data-stage="play"] #w-start { display: none; }
.w-line { width: min(360px, 70vw); height: 4px; background: color-mix(in srgb, var(--ink) 20%, transparent); position: relative; overflow: hidden; animation: fadeUp .8s 1.3s both; }
.w-line i { position: absolute; inset: 0; background: var(--ink); transform-origin: left; transform: scaleX(var(--p, 0)); }
.w-pct { margin: 0; font: 500 12px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; animation: fadeUp .8s 1.3s both; }
.w-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; animation: fadeUp .8s 1.5s both; }
#w-start { animation: tap 1.6s ease-in-out 2.4s infinite; }
@keyframes tap { 50% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--accent) 24%, transparent); } }
@keyframes rise { from { opacity: 0; transform: translateY(70%) rotate(5deg); } to { opacity: 1; transform: none; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
body.reveal .wrap { animation: wrapIn .9s .3s ease-out both; }
@keyframes wrapIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #welcome *, #welcome *::before, body.reveal .wrap { animation-duration: .01s !important; animation-delay: 0s !important; } #welcome { transition-duration: .01s; } }

/* sound control */
.music { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.music .lbl { font: 500 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.music .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.music .seg button { border: 2px solid var(--ink); background: var(--paper); padding: 8px 12px; font: 700 11px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; color: var(--ink); }
.music .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.music input[type="range"] { accent-color: var(--accent); width: 96px; }

/* up next */
.upnext { display: grid; gap: 2px; background: var(--prio); color: var(--prio-ink); border: 2px solid var(--ink); padding: 14px 18px; }
.upnext b { font: 900 40px/1 var(--font-display); text-transform: uppercase; }
.upnext span { font-weight: 500; }
.pass.next .stub { background: var(--prio); color: var(--prio-ink); }
.pass.next .stub small { color: var(--prio-ink); }
@media (prefers-reduced-motion: no-preference) {
  .upnext { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--prio) 40%, transparent); } }
}

/* header */
header.top { padding-top: 20px; display: flex; flex-direction: column; gap: 14px; }
.brandrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font: 900 30px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.brand span { color: var(--accent); }
.gate { font: 500 12px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.open { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.closed { background: var(--warn); }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); }
nav.tabs a {
  text-decoration: none; padding: 9px 14px 8px; font: 700 13px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
  border: 2px solid transparent; border-bottom: 0; margin-bottom: -2px; color: var(--muted);
}
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs a:hover:not([aria-current="page"]) { color: var(--ink); }

main { padding-top: 24px; display: flex; flex-direction: column; gap: 22px; }
h2.label { font: 500 12px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.display { font: 900 clamp(44px, 10vw, 84px)/.9 var(--font-display); text-transform: uppercase; margin: 0; letter-spacing: .01em; text-wrap: balance; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 28px; align-items: end; }
.hero p { margin: 10px 0 0; max-width: 46ch; color: var(--muted); }
.stats { display: flex; gap: 0; border: 2px solid var(--ink); background: var(--paper); }
.stat { padding: 10px 16px; min-width: 104px; }
.stat + .stat { border-left: 2px dashed var(--line); }
.stat b { display: block; font: 800 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stat small { font: 500 11px/1.2 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 620px) { .hero { grid-template-columns: minmax(0, 1fr); } .stats { width: 100%; } .stat { flex: 1; min-width: 0; } }

/* boarding pass */
.pass {
  display: grid; grid-template-columns: 92px minmax(0, 1fr); background: var(--paper); border: 2px solid var(--ink);
  position: relative; margin-bottom: 12px;
}
.pass .stub {
  border-right: 2px dashed var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 6px; gap: 2px; position: relative;
}
.pass .stub::before, .pass .stub::after {
  content: ""; position: absolute; right: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink);
}
.pass .stub::before { top: -12px; clip-path: inset(50% 0 0 0); }
.pass .stub::after { bottom: -12px; clip-path: inset(0 0 50% 0); }
.stub small { font: 500 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stub b { font: 900 48px/.95 var(--font-display); font-variant-numeric: tabular-nums; }
.pass .body { padding: 12px 16px 12px; display: grid; gap: 8px; min-width: 0; }
.pass .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.pass .tag { font: 800 26px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
.pass .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 12px/1.4 var(--font-mono); color: var(--muted); }
.pass .meta b { color: var(--ink); font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 700 10.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 7px 4px; border: 1.5px solid var(--ink); }
.chip.prio { background: var(--prio); color: var(--prio-ink); border-color: var(--prio); }
.chip.ask { border-style: dashed; color: var(--muted); border-color: var(--muted); }
.chip.paid { color: var(--ok); border-color: var(--ok); }
.chip.unpaid { color: var(--warn); border-color: var(--warn); }
.chip.you { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pass.prio { box-shadow: inset 0 6px 0 var(--prio); }
.pass.prio .stub { padding-top: 18px; }
.pass.me { outline: 3px solid var(--accent); outline-offset: 3px; }
.pass.now { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pass.now .stub { border-right-color: var(--bg); }
.pass.now .stub::before, .pass.now .stub::after { border-color: var(--ink); }
.pass.now .stub small, .pass.now .meta { color: color-mix(in srgb, var(--bg) 72%, var(--ink)); }
.pass.now .meta b { color: var(--bg); }
.pass.now .chip { border-color: var(--bg); }
.bar { height: 8px; background: color-mix(in srgb, var(--bg) 22%, var(--ink)); position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--prio); width: 0; }
.clock { font: 700 22px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

.empty { border: 2px dashed var(--line); padding: 28px 20px; display: grid; gap: 10px; justify-items: start; background: color-mix(in srgb, var(--paper) 55%, transparent); }
.empty h3 { margin: 0; font: 800 28px/1 var(--font-display); text-transform: uppercase; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 2px solid var(--accent);
  font: 700 13px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 12px 16px;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn.small { padding: 8px 10px; font-size: 11px; }
.btn.warn { background: transparent; color: var(--warn); border-color: var(--warn); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }

.note { border-left: 4px solid var(--prio); background: var(--paper); padding: 10px 14px; font-size: 14px; }
.note.err { border-left-color: var(--warn); }
.note.ok { border-left-color: var(--ok); }

/* join */
.tickets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 520px) { .tickets { grid-template-columns: minmax(0, 1fr); } }
.tk { position: relative; display: block; cursor: pointer; }
.tk input { position: absolute; opacity: 0; inset: 0; }
.tk .card { border: 2px solid var(--ink); background: var(--paper); padding: 14px 16px; display: grid; gap: 4px; height: 100%; }
.tk .card b { font: 900 52px/.9 var(--font-display); text-transform: uppercase; }
.tk .card em { font: 500 12px/1.3 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-style: normal; }
.tk .card .price { font: 800 24px/1 var(--font-display); }
.tk input:checked + .card { background: var(--ink); color: var(--bg); }
.tk input:checked + .card em { color: color-mix(in srgb, var(--bg) 70%, var(--ink)); }
.tk input:focus-visible + .card { outline: 3px solid var(--accent); outline-offset: 3px; }
.skip { display: flex; gap: 14px; align-items: flex-start; border: 2px solid var(--prio); background: color-mix(in srgb, var(--prio) 14%, var(--paper)); padding: 14px 16px; cursor: pointer; }
.skip input { width: 22px; height: 22px; accent-color: var(--ink); margin-top: 2px; flex: none; }
.skip b { font: 800 22px/1 var(--font-display); text-transform: uppercase; display: block; margin-bottom: 4px; }

<script>
/* Talks to the queue server and gives the page the small interface it uses. */
(function () {
  let token = "";
  try { token = localStorage.getItem("tq-token") || ""; } catch (e) {}
  if (!/^[a-f0-9]{48}$/.test(token)) {
    const a = new Uint8Array(24); crypto.getRandomValues(a);
    token = Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
    try { localStorage.setItem("tq-token", token); } catch (e) {}
  }
  let hostKey = ""; try { hostKey = sessionStorage.getItem("tq-host") || ""; } catch (e) {}
  let state = null, busy = false, again = false, started = false, tickN = 0, first = null;
  const subs = [];
  const hdr = () => { const h = { "Content-Type": "application/json", "X-Token": token }; if (hostKey) h["X-Host-Key"] = hostKey; return h; };
  async function pull(force) {
    if (busy) { if (force) again = true; return false; }
    busy = true; let ok = false;
    try {
      const r = await fetch("/api/state?v=" + (force || !state ? -1 : state.v), { headers: hdr(), cache: "no-store" });
      if (r.ok) { const d = await r.json(); ok = true; if (!d.unchanged) { state = d; subs.slice().forEach(f => f()); } }
    } catch (e) {} finally { busy = false; }
    if (again) { again = false; pull(true); }
    return ok;
  }
  function boot() {
    if (!started) {
      started = true; first = pull(true);
      setInterval(() => { if (document.hidden && (++tickN % 5)) return; pull(); }, 3000);
    }
    return first;
  }
  async function send(method, col, id, data) {
    let r;
    try { r = await fetch("/api/doc/" + col + "/" + encodeURIComponent(id), { method, headers: hdr(), body: data ? JSON.stringify(data) : undefined }); }
    catch (e) { throw { code: "unavailable", message: "Could not reach the server. Try again." }; }
    if (!r.ok) { let m = ""; try { m = (await r.json()).error; } catch (e) {} throw { code: r.status === 403 ? "invalid_argument" : "unavailable", message: m || "Request failed. Try again." }; }
    pull(true);
  }
  const dbAPI = {
    collection(col) {
      return { onSnapshot(next) {
        const f = () => { const m = (state && state[col]) || {}; const docs = Object.keys(m).map(id => ({ id, exists: true, data: () => m[id] })); next({ docs, size: docs.length, empty: !docs.length }); };
        subs.push(f); setTimeout(f, 0);
        return () => { const i = subs.indexOf(f); if (i >= 0) subs.splice(i, 1); };
      } };
    },
    doc(path) { const p = path.split("/"); return { set: d => send("PUT", p[0], p[1], d), delete: () => send("DELETE", p[0], p[1]) }; }
  };
  const userAPI = { isOwner: async () => !!(state && state.host), canEdit: async () => !!(state && state.host), id: async () => state && state.me, can: async () => true };
  window.claude = {
    async use(name) { if (name !== "db" && name !== "user") return null; await boot(); return state ? (name === "db" ? dbAPI : userAPI) : null; },
    async hostLogin(key) {
      key = String(key || "");
      let r; try { r = await fetch("/api/host-check", { method: "POST", headers: Object.assign(hdr(), { "X-Host-Key": key }) }); } catch (e) { return false; }
      if (!r.ok) return false;
      hostKey = key; try { sessionStorage.setItem("tq-host", key); } catch (e) {}
      for (let i = 0; i < 20 && busy; i++) await new Promise(res => setTimeout(res, 100));
      await pull(true);
      return !!(state && state.host);
    }
  };
})();
</script>
<script>
/* ---- Host settings: edit these before sharing ---- */
const CONFIG = {
  host: "✞ H̷Z̷ | M̷K̷Y̷I̷N̷ ✞",
  game: "Tonight's Game",
  currency: "$",
  tickets: [
    { hours: 1, label: "One hour", price: 3,  blurb: "A quick session in the lobby" },
    { hours: 2, label: "Two hours", price: 6, blurb: "Settle in for a full run" }
  ],
  skipPrice: 1,
  pay: { paypalUrl: "https://www.paypal.me/KimariSaunders", cashUrl: "https://cash.app/$KimariSaunders", cashtag: "$KimariSaunders" },
  payNote: "Pay the host with PayPal or Cash App, and add marukiyin on Discord so they can find you. You can pay before or after you join. Your pass shows Unpaid until the host confirms it."
};

/* Lyrics shown while the gate loads: [{ t: seconds into the song, text: "line" }] */
const LYRICS = [];
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => CONFIG.currency + n;
const sessionPrice = hours => (CONFIG.tickets.find(x => x.hours === hours) || CONFIG.tickets[0]).price;
const owe = (hours, skip) => { const t = CONFIG.tickets.find(x => x.hours === hours) || CONFIG.tickets[0]; return t.price + (skip ? CONFIG.skipPrice : 0); };
function payLinks(amount) {
  const p = CONFIG.pay;
  return '<div class="pay"><a class="btn" href="' + esc(p.paypalUrl + "/" + amount + "USD") + '" target="_blank" rel="noopener">Pay ' + money(amount) + ' with PayPal</a>' +
    '<a class="btn" href="' + esc(p.cashUrl + "/" + amount) + '" target="_blank" rel="noopener">Pay ' + money(amount) + ' with Cash App</a>' +
    '<button class="btn ghost" type="button" data-copy="' + esc(p.cashtag) + '">Copy ' + esc(p.cashtag) + "</button></div>";
}
const HOUR = 3600000;
function dur(ms) {
  ms = Math.max(0, ms); const m = Math.round(ms / 60000);
  if (m < 1) return "now"; const h = Math.floor(m / 60), r = m % 60;
  return h ? (r ? h + "h " + r + "m" : h + "h") : r + "m";
}
function clock(ms) {
  ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0");
}

let db = null, userNS = null, myId = null, isOwner = false, canWrite = null;
const entries = new Map(), ops = new Map(), contacts = new Map();
const status = { q: false, o: false, slow: false, dbNull: false };
let lineOpen = true, justJoined = false, hostOnline = true;

/* ---- derived state ---- */
function derive() {
  const rows = [];
  entries.forEach((e, id) => {
    const o = ops.get(id + "-" + e.ticket) || {};
    rows.push({ id, e, o, key: id + "-" + e.ticket, hours: e.hours === 2 ? 2 : 1, skip: !!e.skip });
  });
  const active = rows.filter(r => r.o.status !== "done");
  const playing = active.filter(r => r.o.status === "playing").sort((a, b) => (a.o.startedAt || 0) - (b.o.startedAt || 0));
  const waiting = active.filter(r => r.o.status !== "playing");
  const prio = r => r.skip && r.o.skipPaid ? 0 : 1;
  waiting.sort((a, b) => prio(a) - prio(b) || a.e.ticket - b.e.ticket);
  let acc = 0;
  const now = Date.now();
  playing.forEach(p => { acc = Math.max(acc, (p.o.startedAt || now) + p.hours * HOUR - now); });
  waiting.forEach(w => { w.eta = acc; acc += w.hours * HOUR; });
  return { playing, waiting, totalWait: acc, done: rows.filter(r => r.o.status === "done").length };
}

/* ---- pass markup ---- */
function chips(r) {
  const c = [];
  if (r.skip) c.push(r.o.skipPaid ? '<span class="chip prio">Priority</span>' : '<span class="chip ask">Priority requested</span>');
  c.push(r.o.paid ? '<span class="chip paid">Paid</span>' : '<span class="chip unpaid">Unpaid</span>');
  if (r.id === myId) c.push('<span class="chip you">You</span>');
  return '<div class="chips">' + c.join("") + "</div>";
}
function waitingPass(r, pos, host) {
  const cls = ["pass"]; if (r.skip && r.o.skipPaid) cls.push("prio"); if (pos === 1) cls.push("next"); if (r.id === myId) cls.push("me"); if (host) cls.push("host");
  const ct = contacts.get(r.id);
  const contact = ct && (host || r.id === myId) ? '<span>Find them: <b>' + esc(ct) + "</b></span>" : "";
  let actions = "";
  if (host) {
    actions = '<div class="hostrow">' +
      (r.o.paid ? "" : '<button class="btn small ghost" data-act="paid" data-id="' + esc(r.id) + '">Confirm session paid</button>') +
      (r.skip && !r.o.skipPaid ? '<button class="btn small ghost" data-act="skippaid" data-id="' + esc(r.id) + '">Confirm skip paid</button>' : "") +
      '<button class="btn small" data-act="call" data-id="' + esc(r.id) + '"' + (derive().playing.length ? " disabled" : "") + '>Call up</button>' +
      '<button class="btn small warn" data-act="remove" data-id="' + esc(r.id) + '">Remove</button></div>';
  } else if (r.id === myId) {
    const owed = (r.o.paid ? 0 : sessionPrice(r.hours)) + (r.skip && !r.o.skipPaid ? CONFIG.skipPrice : 0);
    actions = (owed > 0 ? payLinks(owed) : "") + '<div class="hostrow">' + (r.skip ? "" : '<button class="btn small" data-act="addskip">Skip the line · ' + money(CONFIG.skipPrice) + '</button>') + '<button class="btn small ghost" data-act="leave">Leave the line</button></div>';
  }
  return '<article class="' + cls.join(" ") + '"><div class="stub"><small>' + (pos === 1 ? "Up next" : "Spot") + '</small><b>' + pos + '</b></div><div class="body"><div class="who"><span class="tag">' + esc(r.e.tag) + "</span>" + chips(r) + '</div><div class="meta"><span>Session <b>' + r.hours + "h</b></span><span>Boards in <b>~" + dur(r.eta) + "</b></span>" + contact + "</div>" + actions + "</div></article>";
}
function playingPass(r, host) {
  const until = (r.o.startedAt || Date.now()) + r.hours * HOUR;
  const cls = "pass now" + (r.id === myId ? " me" : "");
  return '<article class="' + cls + '"><div class="stub"><small>In game</small><b>▶</b></div><div class="body"><div class="who"><span class="tag">' + esc(r.e.tag) + "</span>" + chips(r) + '</div><div class="meta"><span>Session <b>' + r.hours + 'h</b></span><span>Time left <span class="clock" data-until="' + until + '" data-start="' + (r.o.startedAt || 0) + '">--:--</span></span></div><div class="bar"><i data-bar></i></div>' +
    (host ? '<div class="hostrow"><button class="btn small ghost" data-act="finish" data-id="' + esc(r.id) + '">End session</button></div>' : "") + "</div></article>";
}

/* ---- views ---- */
function viewLine() {
  const d = derive();
  const s = d.playing.length;
  let h = '<section class="hero"><div><h2 class="label">Gate · ' + esc(CONFIG.game) + '</h2><h2 class="display">' + (s ? "Now<br>boarding" : "Spot<br>is open") + "</h2><p>" +
    (s ? "A session is running. Take a pass and the host calls you when the spot clears." : "Nobody is playing right now. The first pass in the line gets called straight in.") +
    '</p></div><div class="stats"><div class="stat"><b>' + d.waiting.length + "</b><small>In line</small></div><div class=\"stat\"><b>" + dur(d.totalWait) + "</b><small>New pass waits</small></div></div></section>";
  if (status.dbNull) h += '<div class="note err">Could not reach the line. Refresh the page to try again.</div>';
  else if (!status.q && status.slow) h += '<div class="note err">The line is slow to load. What you see may be out of date.</div>';
  if (!lineOpen) h += '<div class="note err"><b>The line is closed.</b> The host is not taking new passes right now.</div>';
  if (justJoined) h += '<div class="note ok"><b>You are in the line.</b> ' + esc(CONFIG.payNote) + "</div>";
  const mi = myId ? d.waiting.findIndex(r => r.id === myId) : -1;
  if (mi === 0) h += '<div class="upnext"><b>You are up next</b><span>' + (s ? "The spot frees up in about " + dur(d.waiting[0].eta) + ". Stay on Discord so the host can reach you." : "The spot is open. The host will call you in any moment.") + "</span></div>";
  else if (mi > 0) h += '<div class="note"><b>' + mi + " pass" + (mi === 1 ? "" : "es") + " ahead of you.</b> You board in about " + dur(d.waiting[mi].eta) + ".</div>";
  d.playing.forEach(p => { h += '<div><h2 class="label">Playing now</h2>' + playingPass(p, false) + "</div>"; });
  h += '<div><h2 class="label">Waiting · ' + d.waiting.length + "</h2>";
  if (!d.waiting.length) {
    h += '<div class="empty"><h3>Nobody in line</h3><p>' + (s ? "The spot is taken, but the line behind it is empty. A pass now boards next." : "Take the first pass and you will be called in as soon as the host sees it.") + '</p><a class="btn" href="#join">Get in queue</a></div>';
  } else {
    d.waiting.forEach((r, i) => { h += waitingPass(r, i + 1, false); });
    h += '<a class="btn" href="#join">Get in queue</a>';
  }
  return h + "</div>";
}

function viewJoin() {
  return '<section><h2 class="label">Gate · ' + esc(CONFIG.game) + '</h2><h2 class="display">Get in<br>queue</h2></section><div id="join-status"></div>' +
    '<form class="formgrid" id="join-form" autocomplete="off" novalidate>' +
    '<div><h2 class="label">1 · Pick your session</h2><div class="tickets">' +

    '<div class="total"><span class="label" style="margin:0">Total due</span><b id="f-total"></b></div>' +
    '<div><h2 class="label">Pay the host · PayPal or Cash App</h2><div id="pay-links"></div></div>' +
    '<div class="note">' + esc(CONFIG.payNote) + '</div><p class="consent">We only keep your gamertag, your session choice and, if you add one, a contact that only you and the host can see. By getting in queue you agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</p><div id="join-err"></div><div><button class="btn" id="f-submit" type="submit">Get in queue</button></div></form>';
}
function joinTotal() {
  const f = $("#join-form"); if (!f) return;
  const hrs = Number((f.querySelector("input[name=ticket]:checked") || {}).value || 1);
  const t = CONFIG.tickets.find(x => x.hours === hrs) || CONFIG.tickets[0];
  const amt = t.price + ($("#f-skip").checked ? CONFIG.skipPrice : 0);

function joinDynamic() {

  if (!lineOpen) h = '<div class="note err"><b>The line is closed.</b> The host is not taking new passes right now.</div>';
  else if (mineActive) h = '<div class="note ok"><b>You already hold a pass.</b> <a href="#line">See where you are in the line</a>.</div>';

  el.innerHTML = h;
  if (form) { const off = !lineOpen || mineActive || !myId || canWrite === false; $("#f-submit").disabled = off; }
}

  const d = derive();
  let h = '<section><h2 class="label">Host desk</h2><h2 class="display">Run the<br>gate</h2></section>';
  h += '<div class="toggle"><div><b>' + (lineOpen ? "Line is open" : "Line is closed") + '</b><div class="meta" style="font:500 12px/1.4 var(--font-mono);color:var(--muted)">' + (lineOpen ? "People can take new passes." : "Nobody can take a new pass.") + '</div></div><button class="btn ' + (lineOpen ? "warn" : "") + '" data-act="toggle">' + (lineOpen ? "Close the line" : "Open the line") + "</button></div>";
  h += '<div class="toggle"><div><b>' + (hostOnline ? "Showing online" : "Showing offline") + '</b><div style="font:500 12px/1.4 var(--font-mono);color:var(--muted)">Players see this status in the header.</div></div><button class="btn ' + (hostOnline ? "warn" : "") + '" data-act="hoston">' + (hostOnline ? "Go offline" : "Go online") + "</button></div>";
  h += '<div><h2 class="label">Playing now</h2>';
  h += d.playing.length ? d.playing.map(p => playingPass(p, true)).join("") : '<div class="empty"><h3>Spot is open</h3><p>Call up the first pass in the line below.</p></div>';
  h += '</div><div><h2 class="label">Waiting · ' + d.waiting.length + "</h2>";
  h += d.waiting.length ? d.waiting.map((r, i) => waitingPass(r, i + 1, true)).join("") : '<div class="empty"><h3>Nobody in line</h3><p>New passes show up here as people take them.</p></div>';
  h += "</div>";
  if (d.done) h += '<div class="hostrow"><button class="btn small ghost" data-act="clear">Clear ' + d.done + " finished pass" + (d.done === 1 ? "" : "es") + "</button></div>";
  return h;
}

/* ---- routing and render ---- */
const VIEWS = { line: ["Line", viewLine], join: ["Get in queue", viewJoin], rules: ["Rules", viewRules], host: ["Host desk", viewHost], terms: ["Terms of Service", viewTerms], privacy: ["Privacy Policy", viewPrivacy] };
let current = "line";
function routeName() { const n = location.hash.replace("#", ""); return VIEWS[n] ? n : "line"; }
function renderTabs() {
  $("#tabs").innerHTML = Object.keys(VIEWS).filter(k => k !== "terms" && k !== "privacy" && (k !== "host" || isOwner)).map(k => '<a href="#' + k + '"' + (k === current ? ' aria-current="page"' : "") + ">" + VIEWS[k][0] + "</a>").join("");
}
function renderGate() {
  $("#gate-dot").className = "dot " + (lineOpen ? "open" : "closed");
  $("#gate-text").textContent = lineOpen ? "Gate open" : "Gate closed";
  const hs = $("#st-host"); hs.textContent = hostOnline ? "🟢 Host online" : "🔴 Host offline"; hs.classList.toggle("off", !hostOnline);
  $("#st-q").textContent = "🎟️ Players in queue: " + derive().waiting.length;
}
function render() {
  renderGate();
  notify();
  if (current === "join" && $("#join-form")) { joinDynamic(); return; }
  $("#view").innerHTML = VIEWS[current][1]();
  if (current === "join") { joinDynamic(); joinTotal(); }
  tick();
}
function go() {
  const n = routeName(); const changed = n !== current; current = n;
  if (changed && n !== "line") justJoined = false;
  renderTabs();
  $("#view").innerHTML = ""; render();
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", go);

/* ticking countdowns: text only, no writes */
function tick() {
  const now = Date.now();
  document.querySelectorAll("[data-until]").forEach(el => {
    const until = Number(el.dataset.until), start = Number(el.dataset.start);
    el.textContent = clock(until - now);
    const bar = el.closest(".body").querySelector("[data-bar]");
    if (bar && until > start) bar.style.width = Math.min(100, Math.max(0, (now - start) / (until - start) * 100)) + "%";
  });
}
setInterval(tick, 1000);

/* background sparks: soft gold motes drifting upward */
(function () {
  const cv = $("#sparks"); if (!cv) return;
  const ctx = cv.getContext("2d"); if (!ctx) return;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, parts = [], rgb = "255,248,218", last = 0;
  function spawn(anywhere) {
    return { x: Math.random() * w, y: anywhere ? Math.random() * h : h + 10, r: .8 + Math.random() * 2.4, vy: .15 + Math.random() * .5, vx: (Math.random() - .5) * .25, ph: Math.random() * 6.28, sp: .01 + Math.random() * .02, a: .3 + Math.random() * .55 };
  }
  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    parts = Array.from({ length: Math.round(Math.min(70, w * h / 18000)) }, () => spawn(true));
  }
  function frame(t) {
    if (t - last > 1000) { last = t; const v = getComputedStyle(document.documentElement).getPropertyValue("--spark-rgb").trim(); if (v) rgb = v.replace(/\s+/g, ""); }
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      p.y -= p.vy; p.x += p.vx + Math.sin(p.ph) * .15; p.ph += p.sp;
      if (p.y < -10) Object.assign(p, spawn(false));
      ctx.beginPath(); ctx.fillStyle = "rgba(" + rgb + "," + (p.a * (.55 + .45 * Math.sin(p.ph * 3))).toFixed(3) + ")";
      ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    if (!still) requestAnimationFrame(frame);
  }
  size(); window.addEventListener("resize", size); requestAnimationFrame(frame);
})();

/* ---- actions ---- */
async function setOps(key, patch) {
  const cur = ops.get(key) || {};
  await db.doc("ops/" + key).set(Object.assign({}, cur, patch));
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id, e = entries.get(id), key = e ? id + "-" + e.ticket : null;
  b.disabled = true;
  try {
    if (act === "paid") await setOps(key, { paid: true });
    else if (act === "skippaid") await setOps(key, { skipPaid: true });
    else if (act === "addskip" && myId) { const m = entries.get(myId); if (m) await db.doc("queue/" + myId).set(Object.assign({}, m, { skip: true })); }
    else if (act === "call") await setOps(key, { status: "playing", startedAt: Date.now() });
    else if (act === "finish") await setOps(key, { status: "done", endedAt: Date.now() });
    else if (act === "remove") { await db.doc("queue/" + id).delete(); await db.doc("ops/" + key).delete(); await db.doc("contact/" + id).delete(); }
    else if (act === "toggle") await db.doc("ops/line").set({ open: !lineOpen });
    else if (act === "hoston") await db.doc("ops/host").set({ online: !hostOnline });
    else if (act === "clear") {
      const gone = []; entries.forEach((en, i) => { if ((ops.get(i + "-" + en.ticket) || {}).status === "done") gone.push([i, en.ticket]); });
      for (const [i, t] of gone) { await db.doc("queue/" + i).delete(); await db.doc("ops/" + i + "-" + t).delete(); await db.doc("contact/" + i).delete(); }
    } else if (act === "leave" && myId) { const m = entries.get(myId); await db.doc("queue/" + myId).delete(); await db.doc("contact/" + myId).delete().catch(() => {}); if (m) await db.doc("ops/" + myId + "-" + m.ticket).delete().catch(() => {}); }
  } catch (err) { b.disabled = false; }
});

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-copy]"); if (!b) return;
  const old = b.textContent;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch (e) { b.textContent = b.dataset.copy; }
  setTimeout(() => { b.textContent = old; }, 1600);
});

document.addEventListener("submit", async ev => {
  if (ev.target.id === "host-login") {
    ev.preventDefault();
    const ok = await window.claude.hostLogin($("#host-key").value);
    if (ok) { isOwner = true; renderTabs(); render(); } else $("#host-err").innerHTML = '<div class="note err">That password did not work.</div>';
    return;
  }
  if (ev.target.id !== "join-form") return;
  ev.preventDefault();
  const err = $("#join-err"), tag = $("#f-tag").value.trim();
  if (!tag) { err.innerHTML = '<div class="note err">Enter a gamertag so the host knows who to call.</div>'; $("#f-tag").focus(); return; }
  if (!db || !myId) { err.innerHTML = '<div class="note err">Could not reach the line. Refresh the page to try again.</div>'; return; }
  const hrs = Number(ev.target.querySelector("input[name=ticket]:checked").value);
  $("#f-submit").disabled = true; err.innerHTML = "";
  try {
    const contact = $("#f-contact").value.trim().slice(0, 60);
    await db.doc("queue/" + myId).set({ tag: tag.slice(0, 24), hours: hrs === 2 ? 2 : 1, skip: $("#f-skip").checked, ticket: Date.now() });
    if (contact) await db.doc("contact/" + myId).set({ text: contact }); else await db.doc("contact/" + myId).delete();
    justJoined = true; location.hash = "#line";
  } catch (e) {
    $("#f-submit").disabled = false;
    err.innerHTML = '<div class="note err">' + esc(e && e.message ? e.message : "Could not save your pass. Try again in a moment.") + "</div>";
  }
});
document.addEventListener("input", ev => { if (ev.target.closest && ev.target.closest("#join-form")) joinTotal(); });
document.addEventListener("change", ev => { if (ev.target.closest && ev.target.closest("#join-form")) joinTotal(); });

    const wet = ctx.createGain(); wet.gain.value = .5; conv.connect(wet); wet.connect(lp);
    bus = ctx.createGain(); bus.connect(lp); bus.connect(conv);
    /* short white noise, used for drums */
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const wd = noiseBuf.getChannelData(0); for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
    /* ocean: slow-swelling brown noise */
    const nb = ctx.createBuffer(1, ctx.sampleRate * 4, ctx.sampleRate), nd = nb.getChannelData(0); let last = 0;
    for (let i = 0; i < nd.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; nd[i] = last * 3.5; }
    const ns = ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const nf = ctx.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 520;
    noiseGain = ctx.createGain(); noiseGain.gain.value = 0;
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = .09; lg.gain.value = .04;
    lfo.connect(lg); lg.connect(noiseGain.gain);
    ns.connect(nf); nf.connect(noiseGain); noiseGain.connect(lp); ns.start(); lfo.start();
    return true;
  }

  /* instruments */
  function pluck(t, midi, dur, g, bright) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), e = ctx.createGain();
    o.type = "triangle"; o.frequency.value = mtof(midi);
    f.type = "lowpass"; f.frequency.setValueAtTime(bright, t); f.frequency.exponentialRampToValueAtTime(420, t + dur);
    e.gain.setValueAtTime(.0001, t); e.gain.exponentialRampToValueAtTime(g, t + .012); e.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(f); f.connect(e); e.connect(bus); o.start(t); o.stop(t + dur + .05);
  }
  function pad(t, notes, dur, g) {
    notes.forEach(m => [-6, 6].forEach(det => {
      const o = ctx.createOscillator(), e = ctx.createGain();
      o.type = "sine"; o.frequency.value = mtof(m); o.detune.value = det;
      e.gain.setValueAtTime(.0001, t); e.gain.linearRampToValueAtTime(g, t + dur * .35); e.gain.linearRampToValueAtTime(.0001, t + dur);
      o.connect(e); e.connect(bus); o.start(t); o.stop(t + dur + .05);
    }));
  }
  function ep(t, midi, dur, g) {
    [-4, 4].forEach(det => {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), e = ctx.createGain();
      o.type = "triangle"; o.frequency.value = mtof(midi); o.detune.value = det;
      f.type = "lowpass"; f.frequency.value = 1500;
      e.gain.setValueAtTime(.0001, t); e.gain.exponentialRampToValueAtTime(g, t + .02); e.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(f); f.connect(e); e.connect(bus); o.start(t); o.stop(t + dur + .05);
    });
  }
  function bell(t, midi, dur, g) {
    [[1, 1], [2, .3]].forEach(([m, a]) => {
      const o = ctx.createOscillator(), e = ctx.createGain();
      o.type = "sine"; o.frequency.value = mtof(midi) * m;
      e.gain.setValueAtTime(.0001, t); e.gain.exponentialRampToValueAtTime(g * a, t + .008); e.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(e); e.connect(bus); o.start(t); o.stop(t + dur + .05);
    });
  }
  function chip(t, midi, dur, g, type) {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), e = ctx.createGain();
    o.type = type; o.frequency.value = mtof(midi);
    f.type = "lowpass"; f.frequency.value = 2600;
    e.gain.setValueAtTime(.0001, t); e.gain.exponentialRampToValueAtTime(g, t + .004); e.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(f); f.connect(e); e.connect(bus); o.start(t); o.stop(t + dur + .03);
  }
  function noiseHit(t, dur, type, freq, g) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const e = ctx.createGain(); e.gain.setValueAtTime(g, t); e.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(e); e.connect(bus); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
  }
  function kick(t, g) {
    const o = ctx.createOscillator(), e = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .16);
    e.gain.setValueAtTime(g, t); e.gain.exponentialRampToValueAtTime(.0001, t + .28);
    o.connect(e); e.connect(bus); o.start(t); o.stop(t + .3);
  }
  const snare = (t, g) => noiseHit(t, .16, "bandpass", 1800, g);
  const hat = (t, g) => noiseHit(t, .05, "highpass", 2200, g);

  function schedule(t) {
    if (mode === "calm") {
      if (step % 8 === 0) pad(t, PADS[(step / 8) % PADS.length], 9, .035);
      if (Math.random() < .34) pluck(t + Math.random() * .3, pick(PENT), 3, .09, 2600);
    } else if (mode === "pirate") {
      const bar = Math.floor(step / 6) % 8, pos = step % 6, ch = BARS[bar], m = MEL[(bar * 6 + pos) % 48];
      if (m) pluck(t, m, .5, .13, 3200);
      if (pos === 0) { pluck(t, ROOT[ch][0], .6, .2, 800); pad(t, TRI[ch], 1.6, .03); }
      if (pos === 3) pluck(t, ROOT[ch][1], .5, .15, 800);
    } else if (mode === "lofi") {
      const bar = Math.floor(step / 8) % 4, pos = step % 8, T = t + (pos % 2 ? LEN.lofi * .18 : 0);
      if (pos === 0) LOFI[bar].forEach((m, i) => ep(t + i * .025, m, 2.6, .045));
      if (pos === 0 || pos === 5) pluck(T, LOFI_ROOT[bar], .6, .2, 500);
      if (pos === 0 || pos === 5) kick(T, .5);
      if (pos === 2 || pos === 6) snare(T, .15);
      hat(T, pos % 2 ? .05 : .09);
      if (pos % 2 === 0 && Math.random() < .22) ep(T, pick(LOFI_PENT), 1.4, .05);
    } else if (mode === "island") {
      const bar = Math.floor(step / 8) % 4, pos = step % 8, m = MEL_ISL[(bar * 8 + pos) % 32];
      if (m) bell(t, m, .55, .16);
      if (pos === 0) pluck(t, ISL_BASS[bar][0], .5, .2, 800);
      if (pos === 4) pluck(t, ISL_BASS[bar][1], .5, .16, 800);
      if (pos === 2 || pos === 6) ISL_TRI[bar].forEach(n => pluck(t, n, .25, .035, 2200));
      if (pos % 2 === 1) hat(t, .06);
    } else if (mode === "arcade") {
      const bar = Math.floor(step / 16) % 4, pos = step % 16, ch = ARC[bar];
      chip(t, ch[ARP[pos]], .13, .05, "square");
      if (pos === 0) pluck(t, ARC_BASS[bar], .9, .2, 700);
      if (pos === 8) pluck(t, ARC_BASS[bar] + 7, .9, .16, 700);
      if (pos % 4 === 2) hat(t, .05);
      if (bar % 2 === 1 && pos % 4 === 0 && Math.random() < .5) chip(t, pick(ARC_LEAD), .3, .05, "triangle");
    }
    step++;
  }
  function tick() {
    if (!ctx || mode === "off" || mode === "custom") return;
    while (next < ctx.currentTime + .3) { schedule(next); next += LEN[mode]; }
  }
  function level() { return vol * LVL[mode]; }
  return {
    available() { return !!(window.AudioContext || window.webkitAudioContext); },
    setMode(m) {
      if (m === "custom") { mode = "custom"; clearInterval(timer); if (ctx) master.gain.setTargetAtTime(0, ctx.currentTime, .25); return customStart(); }
      customStop();
      if (m !== "off" && !LEN[m]) return false;
      if (m !== "off" && !ctx && !init()) return false;
      mode = m; clearInterval(timer);
      if (m === "off") {
        if (ctx) { master.gain.setTargetAtTime(0, ctx.currentTime, .25); setTimeout(() => { if (mode === "off" && ctx) ctx.suspend(); }, 1200); }
        return true;
      }
      ctx.resume(); step = 0; next = ctx.currentTime + .15;
      noiseGain.gain.setTargetAtTime(WAVE[m], ctx.currentTime, .4);
      master.gain.setTargetAtTime(level(), ctx.currentTime, .4);
      timer = setInterval(tick, 90); tick();
      return true;
    },
    setVolume(v) { vol = v; if (au) au.volume = v; if (ctx && mode !== "off" && mode !== "custom") master.gain.setTargetAtTime(level(), ctx.currentTime, .1); },
    pause(p) { if (mode === "custom") { if (au) { if (p) au.pause(); else { const q = au.play(); if (q && q.catch) q.catch(() => {}); } } return; } if (!ctx || mode === "off") return; if (p) ctx.suspend(); else { ctx.resume(); next = ctx.currentTime + .1; } }
  };
})();
(function () {
  const box = $("#music"); if (!box) return;
  if (!Music.available()) { box.hidden = true; return; }
  box.addEventListener("click", ev => {
    const b = ev.target.closest("button[data-mode]"); if (!b) return;
    let ok = false; try { ok = Music.setMode(b.dataset.mode); } catch (e) {}
    if (!ok) { box.hidden = true; return; }
    box.querySelectorAll("button[data-mode]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const mode = b.dataset.mode, names = { calm: "Calm", pirate: "Pirate", lofi: "Lo-fi", island: "Island", arcade: "Arcade", custom: "My Song" };
    $("#eq").hidden = mode === "off";
    if (mode !== "off") {
      toast("♪ Now playing: " + names[mode]);
      b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const r = b.getBoundingClientRect();
        ["♪", "♫", "♪", "♬", "♪", "♫", "♪"].forEach((ch, i) => {
          const n = document.createElement("span"); n.className = "mnote"; n.textContent = ch;
          n.style.left = (r.left + r.width / 2) + "px"; n.style.top = (r.top + r.height / 2) + "px";
          n.style.setProperty("--dx", ((i - 3) * 22 + (Math.random() * 14 - 7)) + "px"); n.style.setProperty("--r", ((Math.random() * 50 - 25)) + "deg");
          n.style.animationDelay = (i * 60) + "ms"; document.body.appendChild(n); setTimeout(() => n.remove(), 1800 + i * 60);
        });
      }
    }
  });
  $("#vol").addEventListener("input", ev => Music.setVolume(Number(ev.target.value) / 100));
  document.addEventListener("visibilitychange", () => { try { Music.pause(document.hidden); } catch (e) {} });
})();

/* ---- live feed: toasts when people join or get called, and a celebration on your turn ---- */
function toast(text, big) {
  const box = $("#toasts"); if (!box) return;
  const t = document.createElement("div"); t.className = "toast" + (big ? " big" : ""); t.textContent = text;
  box.appendChild(t); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 350); }, big ? 7000 : 5200);
}
let audioCtx = null;
function chime() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    audioCtx = audioCtx || new AC(); audioCtx.resume();
    const t = audioCtx.currentTime;
    [[659.25, 0], [880, .16], [1318.5, .34]].forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t + d); g.gain.exponentialRampToValueAtTime(.16, t + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d + .9);
      o.connect(g); g.connect(audioCtx.destination); o.start(t + d); o.stop(t + d + 1);
    });
  } catch (e) {}
}
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"); if (!cv) return; const ctx = cv.getContext("2d"); if (!ctx) return;
  const w = cv.width = window.innerWidth, h = cv.height = window.innerHeight;
  const cols = ["#ffd23f", "#ffb938", "#fff3d6", "#ff8a3d", "#ffffff"];
  const ps = Array.from({ length: 120 }, () => ({ x: w / 2 + (Math.random() - .5) * w * .3, y: h * .4, vx: (Math.random() - .5) * 15, vy: -Math.random() * 15 - 4, s: 5 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: cols[Math.floor(Math.random() * cols.length)] }));
  let f = 0; cv.hidden = false;
  (function step() {
    ctx.clearRect(0, 0, w, h);
    ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++f < 180) requestAnimationFrame(step); else { ctx.clearRect(0, 0, w, h); cv.hidden = true; }
  })();
}
function celebrate(msg) { toast(msg, true); confetti(); chime(); }

let primed = false, lastPos = -2, wasPlaying = false;
const seenState = new Map();
function notify() {
  if (!status.q || !status.o) return;
  const d = derive(), cur = new Map();
  d.waiting.forEach(r => cur.set(r.key, "wait")); d.playing.forEach(r => cur.set(r.key, "play"));
  const mi = myId ? d.waiting.findIndex(r => r.id === myId) : -1;
  const meNow = myId ? d.playing.some(r => r.id === myId) : false;
  if (primed) {
    d.waiting.concat(d.playing).forEach(r => {
      const was = seenState.get(r.key), now = cur.get(r.key);
      if (was === undefined) toast("🎟️ " + r.e.tag + " got in queue" + (r.skip && r.o.skipPaid ? " with priority" : ""));
      else if (was === "wait" && now === "play" && r.id !== myId) toast("▶ " + r.e.tag + " is playing now");
    });
    if (meNow && !wasPlaying) celebrate("It's your turn! Jump in the game");
    else if (mi === 0 && lastPos > 0) celebrate("You are up next");
  }
  seenState.clear(); cur.forEach((v, k) => seenState.set(k, v));
  lastPos = mi; wasPlaying = meNow; primed = true;
}

/* ---- intro: tap to enter, My Song plays with lyrics while the bar fills, then the gate opens ---- */
(function () {
  const el = $("#welcome"); if (!el) return;
  let seen = false; try { seen = sessionStorage.getItem("tq-welcome") === "1"; } catch (e) {}
  if (seen) { el.remove(); return; }
  $("#w-title").innerHTML = [..."WELCOME"].map((c, i) => '<span style="--i:' + i + '">' + c + "</span>").join("");
  $("#w-title").setAttribute("aria-label", "Welcome");
  $("#w-host").textContent = CONFIG.host;
  el.dataset.stage = "gate";
  document.documentElement.style.overflow = "hidden";
  const cv = $("#w-viz"), cx = cv.getContext("2d"), fill = $("#w-fill"), pct = $("#w-pct"), lyr = $("#w-lyrics");
  const ink = (getComputedStyle(document.documentElement).getPropertyValue("--ink") || "#2b1b06").trim();
  let au = null, ac = null, an = null, bins = null, raf = 0, done = false, li = -2, t0 = 0;
  function size() { cv.width = window.innerWidth; cv.height = window.innerHeight; }
  size(); window.addEventListener("resize", size);
  function setLine(txt) { lyr.textContent = ""; const s = document.createElement("span"); s.textContent = txt; lyr.appendChild(s); }
  function frame(ts) {
    if (done) return;
    const w = cv.width, h = cv.height, n = 56, bw = w / n;
    cx.clearRect(0, 0, w, h);
    if (an) an.getByteFrequencyData(bins);
    cx.fillStyle = ink; cx.globalAlpha = .28;
    for (let i = 0; i < n; i++) {
      const v = an ? bins[Math.min(bins.length - 1, Math.floor(i * bins.length / n))] / 255 : .22 + .16 * Math.sin(ts / 260 + i * .55);
      const bh = Math.max(4, v * h * .42);
      cx.fillRect(i * bw + bw * .16, h - bh, bw * .68, bh);
    }
    cx.globalAlpha = 1;
    if (el.dataset.stage === "play") {
      let p, t;
      if (au && au.duration) { t = au.currentTime; p = t / au.duration; }
      else { t = (ts - t0) / 1000; p = Math.min(1, t / 4); if (!au && p >= 1) { finish(); return; } }
      fill.style.setProperty("--p", Math.min(1, p).toFixed(4));
      pct.textContent = "Loading the gate… " + Math.round(Math.min(1, p) * 100) + "%";
      let k = -1; for (let i = 0; i < LYRICS.length; i++) if (LYRICS[i].t <= t) k = i;
      if (k !== li) { li = k; if (LYRICS.length) setLine(k >= 0 ? LYRICS[k].text : "♪"); }
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  function start() {
    if (el.dataset.stage !== "gate") return;
    el.dataset.stage = "play"; t0 = performance.now();
    if (!LYRICS.length) setLine("♪ My Song");
    try {
      au = new Audio(CUSTOM_SONG);
      au.addEventListener("ended", finish);
      try { const AC = window.AudioContext || window.webkitAudioContext; ac = new AC(); const src = ac.createMediaElementSource(au); an = ac.createAnalyser(); an.fftSize = 128; bins = new Uint8Array(an.frequencyBinCount); src.connect(an); an.connect(ac.destination); ac.resume(); } catch (e) { an = null; }
      const q = au.play(); if (q && q.catch) q.catch(() => { au = null; });
    } catch (e) { au = null; }
  }
  function finish() {
    if (done) return; done = true; cancelAnimationFrame(raf);
    try { sessionStorage.setItem("tq-welcome", "1"); } catch (e) {}
    try { if (au) au.pause(); if (ac) ac.close(); } catch (e) {}
    el.dataset.stage = "done"; el.classList.add("out"); document.documentElement.style.overflow = ""; document.body.classList.add("reveal");
    setTimeout(() => el.remove(), 1400);
  }
  $("#w-start").addEventListener("click", start);
  $("#w-skip").addEventListener("click", finish);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") finish(); });
  try { $("#w-start").focus({ preventScroll: true }); } catch (e) {}
})();

/* ---- boot: page renders first, live data lights up after ---- */
$("#foot-host").textContent = "Hosted by " + CONFIG.host;
$("#host-name").textContent = CONFIG.host;
$("#copy-disc").addEventListener("click", async () => {
  const b = $("#copy-disc");
  try { await navigator.clipboard.writeText("marukiyin"); b.textContent = "Copied"; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("#disc-name")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected"; }
  setTimeout(() => { b.textContent = "Copy"; }, 1600);
});
go();
(async () => {
  userNS = await claude.use("user");
  if (userNS) {
    try { isOwner = await userNS.isOwner(); myId = await userNS.id(); canWrite = await userNS.can("data.write"); } catch (e) {}
    renderTabs();
  }
  db = await claude.use("db");
  if (!db) { status.dbNull = true; render(); return; }
  const slow = setTimeout(() => { status.slow = true; render(); }, 10000);
  db.collection("queue").onSnapshot(s => {
    status.q = true; clearTimeout(slow); entries.clear();
    s.docs.forEach(d => { const v = d.data(); if (v && typeof v.tag === "string" && typeof v.ticket === "number") entries.set(d.id, v); });
    render();
  }, () => { status.slow = true; render(); });
  db.collection("ops").onSnapshot(s => {
    status.o = true; ops.clear();
    s.docs.forEach(d => { ops.set(d.id, d.data() || {}); });
    const l = ops.get("line"); lineOpen = !(l && l.open === false);
    const hs = ops.get("host"); hostOnline = !(hs && hs.online === false);
    render();
  }, () => {});
  db.collection("contact").onSnapshot(s => {
    contacts.clear();
    s.docs.forEach(d => { const v = d.data(); if (v && typeof v.text === "string") contacts.set(d.id, v.text); });
    render();
  }, () => {});
})();
